name: Draw a new edition

on:
  schedule:
    # 4x daily, roughly 06:00 / 12:00 / 18:00 / 00:00 US Eastern.
    # GitHub cron is UTC only and has no DST handling, so these drift by an
    # hour in winter. Deliberately at :17 rather than on the hour -- GitHub
    # delays scheduled jobs under load, and the top of the hour is the worst of
    # it.
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch:        # the "Run workflow" button, incl. the phone app

# Needed to push the redrawn edition back to the repo.
permissions:
  contents: write

concurrency:
  group: edition            # never let two draws race on news.db
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    # 15, not 10: once a day the NYT print edition adds ~17 API calls, paced
    # 13s apart to stay under NYT's limit of 5 a minute (~4 minutes).
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull the feeds and draw
        # fetch.py always exits 0 -- a thin section or a failing feed is
        # reported on the page and as a warning, never fatal (see CLAUDE.md).
        # The NYT key is the project's one secret; it reaches only this step.
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: python fetch.py

      - name: Export the page
        run: python export.py

      - name: Commit the new edition
        run: |
          git config user.name  "newsfront-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A over the whole directory, not docs/index.html: the export writes
          # one page per section, and a section retired from sources.py has its
          # stale page DELETED, which only -A stages.
          git add -A docs news.db
          # A draw with genuinely nothing new leaves both files untouched.
          if git diff --staged --quiet; then
            echo "nothing changed; no commit"
          else
            git commit -m "Edition $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
